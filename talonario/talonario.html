<title>Talonario de Rifas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: una franja superior con la rifa activa, luego el talonario como cuadrícula de boletas perforadas; el detalle de cada número abre como talón desprendible. */
:root{
  --paper:#f6f1e3; --stock:#fffaf0; --ink:#1f3b2f; --ink-soft:#4f6a5d; --rule:#d9cfb6;
  --ochre:#c98a12; --ochre-bg:#fbedc9; --paid:#1f6b45; --paid-bg:#dcefe3; --danger:#a3361f;
  --accent:#1f6b45; --on-accent:#ffffff; --shadow:rgba(31,59,47,.12);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141b17; --stock:#1c2520; --ink:#eae4d2; --ink-soft:#a9b5ab; --rule:#33413a;
  --ochre:#e9b34a; --ochre-bg:#3a2f16; --paid:#7fd3a4; --paid-bg:#173826; --danger:#f08a6f;
  --accent:#7fd3a4; --on-accent:#0f1a14; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141b17; --stock:#1c2520; --ink:#eae4d2; --ink-soft:#a9b5ab; --rule:#33413a;
  --ochre:#e9b34a; --ochre-bg:#3a2f16; --paid:#7fd3a4; --paid-bg:#173826; --danger:#f08a6f;
  --accent:#7fd3a4; --on-accent:#0f1a14; --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
h1{font-size:2.4rem;text-transform:uppercase}
h2{font-size:1.8rem}
h3{font-size:1.3rem}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top p{margin:4px 0 0;color:var(--ink-soft)}
.mode{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.mode::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ochre)}
.mode.online::before{background:var(--paid)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input{font:inherit;color:var(--ink);background:var(--stock);border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.bar select{width:auto;max-width:100%;flex:1 1 220px}
button,.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.warn{border-color:var(--ochre);color:var(--ink);background:var(--ochre-bg)}
button.ghost{border-color:var(--rule)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn.wa{background:var(--paid);border-color:var(--paid);color:var(--on-accent)}
/* rifa card */
.rifa{background:var(--stock);border:1.5px solid var(--rule);border-radius:12px;display:grid;grid-template-columns:1fr auto;overflow:hidden;box-shadow:0 2px 0 var(--shadow)}
.rifa-main{padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rifa-main .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-soft);font-size:.92rem}
.rifa-main .meta b{color:var(--ink);font-weight:600}
.rifa-stub{border-left:2px dashed var(--rule);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:150px;background:var(--ochre-bg)}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.big{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
/* resumen: barra de avance + leyenda que filtra */
.summary{background:var(--stock);border:1.5px solid var(--rule);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.progress-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;color:var(--ink-soft)}
.progress-head .big{font-size:1.7rem;color:var(--ink)}
.pend{color:var(--ochre);font-weight:600}
.progress{height:12px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);display:flex;overflow:hidden}
.p-paid{background:var(--paid)} .p-res{background:var(--ochre)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lg{justify-content:flex-start;gap:8px;border:1.5px solid var(--rule);background:var(--paper);padding:10px 12px;min-height:48px}
.lg b{margin-left:auto;font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1}
.sw{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--rule);background:var(--stock);flex:none}
.lg.res .sw{background:var(--ochre-bg);border-color:var(--ochre)} .lg.paid .sw{background:var(--paid-bg);border-color:var(--paid)}
.lg[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--stock)}
.guide{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;counter-reset:paso}
.guide li{counter-increment:paso;background:var(--ochre-bg);border-radius:10px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.guide li::before{content:counter(paso);font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;color:var(--ochre)}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1}
.full{width:100%}
#main{display:flex;flex-direction:column;gap:16px}
.big-btn{min-height:56px;font-size:1.05rem}
.step{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700}
.flabel{font-size:.82rem;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--paper);border-radius:10px;padding:4px}
.seg button{border:1.5px solid transparent;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--stock);border-color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.recent{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.88rem;color:var(--ink-soft)}
.recent button{border-radius:999px;border-color:var(--rule);background:var(--paper);padding:8px 14px;font-size:.88rem}
.linkbtn{background:none;border:none;padding:8px 0;color:var(--danger);text-decoration:underline;font-weight:600;font-size:.9rem}
.confirm-sm{background:var(--ochre-bg);border:1.5px solid var(--ochre);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm-sm p{margin:0}
.n.res .tag{position:absolute;left:0;right:0;bottom:2px;font-family:var(--f-body);font-size:.5rem;letter-spacing:.06em;font-weight:700;color:var(--ochre)}
/* táctil */
button,.btn,.n,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.btn{min-height:44px}
body.lock{overflow:hidden}
/* grid of tickets */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.n{position:relative;font-family:var(--f-display);font-weight:800;font-size:1.25rem;padding:12px 0 10px;border-radius:6px;border:1.5px solid var(--rule);background:var(--stock);color:var(--ink);font-variant-numeric:tabular-nums;cursor:pointer;line-height:1}
.n::before,.n::after{content:"";position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--paper);border:1.5px solid var(--rule)}
.n::before{left:-5px;clip-path:inset(0 0 0 50%)} .n::after{right:-5px;clip-path:inset(0 50% 0 0)}
.n:hover{border-color:var(--ink)}
.n.res{background:var(--ochre-bg);border-color:var(--ochre)}
.n.paid{background:var(--paid-bg);border-color:var(--paid);color:var(--paid)}
.n.paid .tag{position:absolute;left:0;right:0;bottom:2px;font-family:var(--f-body);font-size:.55rem;letter-spacing:.08em;font-weight:700}
.empty{background:var(--stock);border:1.5px dashed var(--rule);border-radius:12px;padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;max-width:60ch;color:var(--ink-soft)}
.note{font-size:.85rem;color:var(--ink-soft);margin:0}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--stock);color:var(--ink);border-radius:14px;width:100%;max-width:520px;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:2px dashed var(--rule)}
.sheet-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.82rem;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions>*{flex:1 1 150px}
.x{border:none;font-size:1.4rem;padding:4px 10px;line-height:1}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--rule);color:var(--ink)}
.pill.res{background:var(--ochre-bg);color:var(--ink);border:1px solid var(--ochre)}
.pill.paid{background:var(--paid-bg);color:var(--paid);border:1px solid var(--paid)}
.recibo{font-family:var(--f-mono);background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px 16px;white-space:pre-wrap;word-break:break-word;font-size:.88rem;position:relative}
.recibo .sello{position:absolute;right:12px;top:10px;border:2px solid var(--paid);color:var(--paid);font-family:var(--f-display);font-weight:800;font-size:1rem;padding:2px 8px;transform:rotate(-8deg);border-radius:4px;letter-spacing:.06em}
.err{color:var(--danger);font-weight:600;margin:0}
.recibo-img{min-height:120px;display:flex;align-items:center;justify-content:center;background:var(--paper);border-radius:10px}
.recibo-img img{display:block;width:100%;height:auto;border-radius:10px}
details.txt{display:flex;flex-direction:column;gap:10px}
details.txt summary{cursor:pointer;font-weight:600;color:var(--ink-soft)}
details.txt[open] .recibo{margin-block:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .wrap{gap:14px;padding-block:12px 40px}
  h1{font-size:1.7rem}
  .top p{display:none}
  /* barra fija arriba con la rifa activa y el botón de nueva rifa */
  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin-inline:-16px;padding:8px 16px;border-bottom:1.5px solid var(--rule);flex-wrap:nowrap}
  .bar select{flex:1 1 auto;width:0;min-height:48px}
  .bar button{flex:none;min-height:48px;padding-inline:14px}
  select,input{font-size:16px;min-height:48px}
  .rifa{grid-template-columns:1fr}
  .rifa-main{padding:14px 16px}
  .rifa-stub{border-left:none;border-top:2px dashed var(--rule);flex-direction:row;align-items:baseline;justify-content:flex-start;gap:10px;flex-wrap:wrap;padding:12px 16px}
  .summary{padding:14px}
  .progress-head .big{font-size:1.45rem}
  .legend{gap:6px}
  .lg{flex-direction:column;align-items:flex-start;gap:4px;padding:8px 10px}
  .lg .sw{position:absolute;opacity:0}
  .lg{position:relative;border-top-width:5px}
  .lg.free{border-top-color:var(--rule)} .lg.res{border-top-color:var(--ochre)} .lg.paid{border-top-color:var(--paid)}
  .lg b{margin-left:0}
  .guide{grid-template-columns:1fr;gap:6px}
  .guide li{padding:9px 12px}
  #main{gap:12px}
  .row{grid-template-columns:1fr}
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:94%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet-head{position:sticky;top:0;background:var(--stock);z-index:1;padding-top:22px}
  .sheet-head::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--rule)}
  .sheet-body{padding:16px 16px 20px}
  .actions>*{flex:1 1 120px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px}
  .n{font-size:1.35rem;padding:15px 0 13px}
  .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){.n{transition:transform .12s,border-color .12s}.n:active{transform:scale(.95)}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Talonario de Rifas</h1>
      <p>Marca los números que vendes, cobra por Nequi y envía el comprobante por WhatsApp.</p>
    </div>
    <span id="mode" class="mode">Conectando…</span>
  </header>

  <div class="bar">
    <select id="rifaSel" aria-label="Rifa activa"><option value="">Cargando rifas…</option></select>
    <button id="nuevaBtn" class="primary" type="button">+ Nueva rifa</button>
  </div>

  <main id="main">
    <div class="empty">
      <h2>Cargando el talonario</h2>
      <p>Aquí aparecerán tus rifas y sus números.</p>
    </div>
  </main>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">Número</h2><button class="x" type="button" id="closeBtn" aria-label="Cerrar">×</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => "$" + Number(v||0).toLocaleString("es-CO");
const digits = s => String(s||"").replace(/\D/g,"");
function waPhone(p){ let d = digits(p); if (d.length === 10 && d[0] === "3") d = "57" + d; return d; }
function pad(n, total){ return String(n).padStart(String(total-1).length, "0"); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fechaHoy(){ return new Date().toLocaleString("es-CO",{dateStyle:"medium",timeStyle:"short"}); }

/* ---------- Almacenamiento: base compartida (db) o este dispositivo ---------- */
function localStore(){
  const K = "talonario-v1";
  let state = { rifas:{}, numeros:{} };
  try { const raw = localStorage.getItem(K); if (raw) state = JSON.parse(raw); } catch(e){}
  const subsR = new Set(), subsN = new Map();
  const save = () => { try { localStorage.setItem(K, JSON.stringify(state)); } catch(e){} };
  const emitR = () => subsR.forEach(f => f(Object.values(state.rifas)));
  const emitN = id => (subsN.get(id)||new Set()).forEach(f => f({...(state.numeros[id]||{})}));
  return {
    online:false,
    watchRifas(cb){ subsR.add(cb); setTimeout(()=>cb(Object.values(state.rifas))); return ()=>subsR.delete(cb); },
    async saveRifa(r){ state.rifas[r.id] = r; save(); emitR(); },
    watchNumeros(id, cb){ if(!subsN.has(id)) subsN.set(id,new Set()); subsN.get(id).add(cb); setTimeout(()=>cb({...(state.numeros[id]||{})})); return ()=>subsN.get(id).delete(cb); },
    async getNumero(id, n){ return (state.numeros[id]||{})[n] || null; },
    async lock(){ return true; },
    async setNumero(id, n, data){ state.numeros[id] = state.numeros[id]||{}; state.numeros[id][n] = data; save(); emitN(id); },
    async delNumero(id, n){ if(state.numeros[id]) delete state.numeros[id][n]; save(); emitN(id); }
  };
}
function dbStore(db){
  const holder = uid();
  return {
    online:true,
    watchRifas(cb, onErr){
      return db.collection("rifas").onSnapshot(s => cb(s.docs.map(d => ({id:d.id, ...d.data()})), s), onErr);
    },
    async saveRifa(r){ const {id, ...rest} = r; await db.doc("rifas/"+id).set(rest); },
    watchNumeros(id, cb, onErr){
      return db.collection("rifas/"+id+"/numeros").onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); cb(m, s); }, onErr);
    },
    async getNumero(id, n){ const s = await db.doc("rifas/"+id+"/numeros/"+n).get(); return s.exists ? s.data() : null; },
    async lock(id, n){ const r = await db.doc("rifas/"+id+"/numeros/"+n).acquire({holder, ttlMs:5000}); return r.acquired; },
    async setNumero(id, n, data){ await db.doc("rifas/"+id+"/numeros/"+n).set(data); },
    async delNumero(id, n){ await db.doc("rifas/"+id+"/numeros/"+n).delete(); }
  };
}

/* ---------- Estado de la vista ---------- */
let store = null, rifas = [], numeros = {}, activa = null, unsubN = null, filtro = "todos", busca = "";
let loadTimer = null, rifasLoaded = false;

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden = true, 2600); }

function remember(id){ try { localStorage.setItem("talonario-activa", id); } catch(e){} }
function recalled(){ try { return localStorage.getItem("talonario-activa"); } catch(e){ return null; } }

function setRifas(list){
  rifasLoaded = true;
  rifas = list.slice().sort((a,b) => (b.creada||0) - (a.creada||0));
  const sel = $("#rifaSel");
  if (!rifas.length){ sel.innerHTML = '<option value="">Sin rifas todavía</option>'; }
  else sel.innerHTML = rifas.map(r => `<option value="${esc(r.id)}">${esc(r.nombre)}</option>`).join("");
  const want = activa?.id || (location.hash.startsWith("#r-") ? location.hash.slice(3) : null) || recalled();
  const found = rifas.find(r => r.id === want) || rifas[0] || null;
  selectRifa(found ? found.id : null);
}

function selectRifa(id){
  const r = rifas.find(x => x.id === id) || null;
  const changed = (r?.id) !== (activa?.id);
  activa = r;
  if (r){ $("#rifaSel").value = r.id; remember(r.id); }
  if (changed){
    if (unsubN) unsubN();
    unsubN = null; numeros = {};
    if (r){
      unsubN = store.watchNumeros(r.id, m => { numeros = m; render(); refreshSheet(); }, e => toast("No se pudieron leer los números: " + (e?.message||"")));
    }
  }
  render();
}

function counts(){
  const total = activa.cantidad;
  let paid = 0, res = 0;
  Object.values(numeros).forEach(v => { if (v.estado === "pagado") paid++; else if (v.estado === "apartado") res++; });
  return { total, paid, res, libres: total - paid - res };
}

function render(){
  const main = $("#main");
  if (!rifasLoaded) return;
  if (!activa){
    main.innerHTML = `<div class="empty"><h2>Crea tu primera rifa</h2>
      <p>Escribe el nombre de la rifa, el premio, el valor de cada número y tu Nequi. Después marcas cada número vendido y le envías el comprobante al cliente por WhatsApp.</p>
      <button class="primary" type="button" data-act="nueva">+ Nueva rifa</button></div>`;
    return;
  }
  const c = counts(), r = activa;
  let cells = "";
  for (let i = 0; i < r.cantidad; i++){
    const k = pad(i, r.cantidad), v = numeros[k];
    const st = v?.estado === "pagado" ? "paid" : v?.estado === "apartado" ? "res" : "free";
    if (filtro !== "todos" && filtro !== st) continue;
    if (busca && !k.includes(busca) && !(v && String(v.cliente||"").toLowerCase().includes(busca.toLowerCase()))) continue;
    const label = st === "paid" ? `Número ${k}, pagado` : st === "res" ? `Número ${k}, apartado` : `Número ${k}, libre`;
    const tip = v ? ` title="${esc(v.cliente)}"` : "";
    cells += `<button type="button" class="n ${st==='free'?'':st}" data-n="${k}" aria-label="${label}${v ? ", " + esc(v.cliente) : ""}"${tip}>${k}${st==='paid'?'<span class="tag">PAGO</span>':st==='res'?'<span class="tag">APART.</span>':''}</button>`;

function msgRecibo(r, k, v){

/* ---------- Imagen del comprobante ---------- */
const RC = { paper:"#efe7d2", stock:"#fffaf0", ink:"#1f3b2f", soft:"#5d7468", rule:"#e4dac2", ochre:"#c98a12", ochreBg:"#fbedc9", paid:"#1f6b45", white:"#fffaf0" };
const FD = '"Big Shoulders Display", "Arial Narrow", Impact, sans-serif', FB = '"Figtree", system-ui, sans-serif', FM = '"Courier Prime", "Courier New", monospace';
async function fontsReady(){
  try { await Promise.all(['800 100px "Big Shoulders Display"','700 40px "Figtree"','600 40px "Figtree"','400 40px "Figtree"','700 40px "Courier Prime"'].map(f => document.fonts.load(f))); } catch(e){}
}
function wrapText(ctx, text, maxW){
  const words = String(text).split(/\s+/), lines = []; let line = "";
  for (const w of words){ const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function spacing(ctx, px){ if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px"; }
async function reciboPNG(r, k, v){
  await fontsReady();
  const W = 1080, M = 56, CW = W - 2*M, PX = 72, X = M + PX, XR = M + CW - PX;
  const meas = document.createElement("canvas").getContext("2d");
  meas.font = `800 80px ${FD}`;
  const title = wrapText(meas, String(r.nombre).toUpperCase(), CW - 2*PX).slice(0, 3);
  const rows = [["Cliente", v.cliente], ["Valor pagado", money(r.valor)], ["Pagado por Nequi a", r.nequi + (r.titular ? " · " + r.titular : "")],
    ["Referencia Nequi", v.ref], ["Fecha de pago", v.pagadoEn], ["Premio", r.premio], ["Juega con", r.loteria], ["Fecha del sorteo", r.fecha]].filter(x => x[1]);
  meas.font = `700 34px ${FB}`;
  const rowsL = rows.map(([l, val]) => [l, wrapText(meas, val, CW - 2*PX - 330).slice(0, 3)]);
  const headH = 120 + title.length * 84 + 40, numH = 330;
  const rowsH = rowsL.reduce((s, [, ls]) => s + 46 + ls.length * 44, 0) + 24;
  const stubH = 270, cardH = headH + numH + rowsH + 40 + stubH, H = cardH + 2*M;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"); ctx.textBaseline = "alphabetic";
  ctx.fillStyle = RC.paper; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.shadowColor = "rgba(31,59,47,.18)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  rr(ctx, M, M, CW, cardH, 30); ctx.fillStyle = RC.stock; ctx.fill(); ctx.restore();
  ctx.save(); rr(ctx, M, M, CW, cardH, 30); ctx.clip();
  /* encabezado */
  ctx.fillStyle = RC.ink; ctx.fillRect(M, M, CW, headH);
  let y = M + 82;
  ctx.fillStyle = RC.ochre; ctx.font = `700 28px ${FB}`; spacing(ctx, 5); ctx.textAlign = "left";
  ctx.fillText("COMPROBANTE DE PAGO", X, y); spacing(ctx, 0);
  ctx.fillStyle = RC.white; ctx.font = `800 80px ${FD}`;
  title.forEach(line => { y += 84; ctx.fillText(line, X, y); });
  /* número */
  const ny = M + headH;
  ctx.fillStyle = RC.soft; ctx.font = `700 28px ${FB}`; spacing(ctx, 5); ctx.fillText("NÚMERO", X, ny + 78); spacing(ctx, 0);
  ctx.fillStyle = RC.paid; ctx.font = `800 240px ${FD}`; ctx.fillText(k, X - 8, ny + 296);
  /* sello */
  ctx.save(); ctx.translate(XR - 165, ny + 180); ctx.rotate(-0.17);
  ctx.strokeStyle = RC.paid; ctx.lineWidth = 8; rr(ctx, -165, -72, 330, 144, 18); ctx.stroke();
  ctx.lineWidth = 2.5; rr(ctx, -150, -57, 300, 114, 12); ctx.stroke();
  ctx.fillStyle = RC.paid; ctx.font = `800 92px ${FD}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; spacing(ctx, 4);
  ctx.fillText("PAGADO", 4, 6); spacing(ctx, 0); ctx.restore();
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  /* filas */
  y = ny + numH;
  rowsL.forEach(([label, lines]) => {
    ctx.strokeStyle = RC.rule; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X, y); ctx.lineTo(XR, y); ctx.stroke();
    ctx.fillStyle = RC.soft; ctx.font = `600 27px ${FB}`; ctx.textAlign = "left"; ctx.fillText(label, X, y + 56);
    ctx.fillStyle = RC.ink; ctx.font = `700 34px ${FB}`; ctx.textAlign = "right";
    lines.forEach((ln, i) => ctx.fillText(ln, XR, y + 56 + i*44));
    y += 46 + lines.length * 44;
  });
  ctx.textAlign = "left";
  /* talón desprendible */
  const yP = M + headH + numH + rowsH + 40;
  ctx.fillStyle = RC.ochreBg; ctx.fillRect(M, yP, CW, cardH + M - yP);
  ctx.strokeStyle = RC.ochre; ctx.lineWidth = 3; ctx.setLineDash([16, 12]);
  ctx.beginPath(); ctx.moveTo(M + 40, yP); ctx.lineTo(M + CW - 40, yP); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = RC.soft; ctx.font = `700 26px ${FB}`; spacing(ctx, 5); ctx.fillText("CÓDIGO DE VERIFICACIÓN", X, yP + 72); spacing(ctx, 0);
  ctx.fillStyle = RC.ink; ctx.font = `700 60px ${FM}`; ctx.fillText(v.codigo || "", X, yP + 146);
  ctx.fillStyle = RC.soft; ctx.font = `400 28px ${FB}`;
  wrapText(ctx, `El número ${k} quedó registrado y bloqueado a nombre de ${v.cliente}. ¡Mucha suerte!`, CW - 2*PX).slice(0, 2)
    .forEach((ln, i) => ctx.fillText(ln, X, yP + 204 + i*38));
  ctx.restore();
  /* muescas de perforación */
  ctx.fillStyle = RC.paper;
  [M, M + CW].forEach(cx => { ctx.beginPath(); ctx.arc(cx, yP, 26, 0, Math.PI*2); ctx.fill(); });
  return new Promise(res => cv.toBlob(res, "image/png"));
}
async function descargar(){

  } catch(e){ if (e?.code === "declined") return; }
  try {
    const a = document.createElement("a"); a.href = sheet.imgUrl; a.download = name; document.body.appendChild(a); a.click(); a.remove();

  } catch(e){ toast("Mantenga presionada la imagen para guardarla"); }

function setPago(si){

function fmtTel(t){ const d = digits(t); return d.length === 10 ? d.replace(/(\d{3})(\d{3})(\d{4})/, "$1 $2 $3") : String(t || ""); }
let lastCliente = null;

function showErr(id, msg){ const e = $(id); if (e){ e.textContent = msg; e.hidden = !msg; } }

async function cambiarNumero(kind){
  const r = activa, k = sheet.k, cur = numeros[k];
  let cliente = cur?.cliente, telefono = cur?.telefono;
  if (!cur){
    cliente = ($("#nCliente")?.value || "").trim();
    telefono = ($("#nTel")?.value || "").trim();
    if (!cliente) return showErr("#nErr", "Escribe el nombre del cliente.");
    if (digits(telefono).length < 10) return showErr("#nErr", "Escribe el WhatsApp del cliente con 10 dígitos, por ejemplo 310 555 1234.");
  }
  const ref = ($("#nRef")?.value || "").trim();
  sheet.busy = true;
  const btns = document.querySelectorAll("#sheetBody button"); btns.forEach(b => b.disabled = true);
  try {
    if (!(await store.lock(r.id, k))) throw new Error("Otra persona está marcando este número en este momento. Intenta en unos segundos.");
    const now = await store.getNumero(r.id, k);
    if (now?.estado === "pagado") throw new Error("Este número ya fue pagado por " + now.cliente + ". No se puede volver a vender.");
    if (kind === "liberar"){
      await store.delNumero(r.id, k); toast("Número " + k + " liberado");
    } else if (kind === "apartar"){
      if (now) throw new Error("Este número ya está apartado por " + now.cliente + ".");
      await store.setNumero(r.id, k, { estado:"apartado", cliente, telefono, apartadoEn: fechaHoy() });
      lastCliente = { cliente, telefono };
      vibrar(30);
      toast("Número " + k + " apartado para " + cliente);
    } else {
      if (!cur && now) throw new Error("Este número acaba de ser apartado por " + now.cliente + ".");
      const data = { estado:"pagado", cliente, telefono, ref, pagadoEn: fechaHoy(), codigo: codigo(r, k) };
      await store.setNumero(r.id, k, data);
      numeros[k] = data;
      lastCliente = { cliente, telefono };
      vibrar([40, 60, 40]);
      toast("Número " + k + " pagado y bloqueado");
    }
    sheet.busy = false; sheet.lastSt = null;
    if (kind === "liberar") closeSheet(); else drawSheet();
    render();
  } catch(e){
    sheet.busy = false;
    btns.forEach(b => b.disabled = false);
    showErr("#nErr", e?.message || "No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
  }
}

async function crearRifa(ev){
  ev.preventDefault();
  const g = id => ($(id).value || "").trim();
  const valor = Number(digits(g("#rValor")));
  if (!valor) return showErr("#rErr", "Escribe el valor de cada número en pesos, por ejemplo 10000.");
  if (digits(g("#rNequi")).length < 10) return showErr("#rErr", "El número Nequi debe tener 10 dígitos.");
  const fecha = g("#rFecha");
  const r = { id: uid(), nombre: g("#rNombre"), premio: g("#rPremio"), valor, cantidad: Number($("#rCant").value),
    nequi: g("#rNequi"), titular: g("#rTitular"), loteria: g("#rLoteria"),
    fecha: fecha ? new Date(fecha + "T12:00").toLocaleDateString("es-CO",{dateStyle:"long"}) : "", creada: Date.now() };
  try {
    await store.saveRifa(r);
    activa = null; remember(r.id);
    if (!rifas.find(x => x.id === r.id)) setRifas([...rifas, r]);
    selectRifa(r.id);
    closeSheet(); toast("Talonario creado");
  } catch(e){ showErr("#rErr", "No se pudo crear la rifa: " + (e?.message||"revisa tu conexión")); }
}

/* ---------- Eventos ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-act]");
  if (!t) { if (e.target.id === "overlay") closeSheet(); return; }
  if (t.dataset.n){ openSheet({type:"num", k:t.dataset.n}); return; }
  if (t.dataset.f){ filtro = (t.dataset.f === filtro && t.dataset.f !== "todos") ? "todos" : t.dataset.f; render(); return; }
  if (t.dataset.pago) return setPago(t.dataset.pago === "si");
  const a = t.dataset.act;
  if (t.id === "nuevaBtn" || a === "nueva") return openSheet({type:"nueva"});
  if (t.id === "closeBtn" || a === "cerrar") return closeSheet();
  if (a === "usar-ultimo" && lastCliente){ $("#nCliente").value = lastCliente.cliente; $("#nTel").value = fmtTel(lastCliente.telefono); return; }
  if (a === "liberar-pre"){ $("#libConfirm").hidden = false; t.hidden = true; return; }
  if (a === "liberar-no"){ $("#libConfirm").hidden = true; $('[data-act="liberar-pre"]').hidden = false; return; }
  if (a === "otro"){ closeSheet(); toast("Toca el siguiente número para " + (lastCliente?.cliente || "el cliente")); return; }
  if (a === "apartar" || a === "pagar" || a === "liberar") return cambiarNumero(a);
  if (a === "compartir" && sheet?.blob){
    const file = new File([sheet.blob], sheet.fileName, {type:"image/png"});
    try {
      if (navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text:"Comprobante de pago · Rifa " + activa.nombre + " · Número " + sheet.k});
        return;
      }
    } catch(err){ if (err && err.name === "AbortError") return; }
    toast("Este navegador no deja compartir la imagen. Descárguela y adjúntela en WhatsApp.");
    return descargar();
  }
  if (a === "descargar" && sheet?.blob) return descargar();
  if (a === "copiar"){
    try { await navigator.clipboard.writeText(sheet.copyText); toast("Comprobante copiado"); }
    catch(_){ const sel = getSelection(), range = document.createRange(); range.selectNodeContents($(".recibo")); sel.removeAllRanges(); sel.addRange(range); toast("Texto seleccionado: cópialo"); }
  }
});
document.addEventListener("submit", e => { if (e.target.id === "fRifa") crearRifa(e); });
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "busca"){ busca = el.value.trim(); render._focusBusca = true; render(); return; }
  if (el.id === "nTel" || el.id === "rNequi"){
    const d = digits(el.value).slice(0, 10);
    el.value = d.length > 6 ? d.replace(/(\d{3})(\d{3})(\d*)/, "$1 $2 $3") : d.length > 3 ? d.replace(/(\d{3})(\d*)/, "$1 $2") : d;
  }
  if (el.id === "rValor"){ const d = digits(el.value).slice(0, 9); el.value = d ? Number(d).toLocaleString("es-CO") : ""; }
});
/* Botón «atrás» de Android: cierra la ventana abierta en vez de salir de la app */
window.addEventListener("popstate", () => { if (sheet) closeSheet(true); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet) closeSheet(); });
$("#rifaSel").addEventListener("change", e => selectRifa(e.target.value));

/* ---------- Arranque ---------- */
function start(s){
  store = s;
  const m = $("#mode");
  m.textContent = s.online ? "Compartido en línea" : "Guardado en este dispositivo";
  m.classList.toggle("online", s.online);
  loadTimer = setTimeout(() => { if (!rifasLoaded){ $("#main").innerHTML = '<div class="empty"><h2>Sin conexión todavía</h2><p>No se pudo leer el talonario. Revisa tu conexión; la página seguirá intentando.</p></div>'; } }, 10000);
  s.watchRifas((list, snap) => { if (!snap || !snap.metadata?.fromCache) clearTimeout(loadTimer); setRifas(list); },
    err => { clearTimeout(loadTimer); $("#main").innerHTML = '<div class="empty"><h2>No se pudo abrir el talonario</h2><p>' + esc(err?.message || "Error desconocido") + '</p></div>'; });
}
const c = window.claude;
if (c && typeof c.use === "function"){
  c.use("db").then(db => start(db ? dbStore(db) : localStore())).catch(() => start(localStore()));
} else {
  start(localStore());
}
})();
</script>
